# -----------------------------------------------------------------------------
# Terraform pull request checks
# Validates every pull request and protected branch push without AWS credentials.
# Checks source configuration only; plans and state never become CI artifacts.
# -----------------------------------------------------------------------------
name: Terraform checks

on:
  pull_request:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Pull request branch routing
  # Production changes enter main only through a PR from develop.
  # ---------------------------------------------------------------------------
  branch-routing:
    name: Branch routing
    runs-on: ubuntu-latest
    env:
      BASE_REF: ${{ github.base_ref }}
      HEAD_REF: ${{ github.head_ref }}
      HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
    steps:
      - name: Check production PR source
        run: |
          if [[ "$GITHUB_EVENT_NAME" == 'pull_request' && "$BASE_REF" == 'main' ]]; then
            test "$HEAD_REF" = 'develop'
            test "$HEAD_REPOSITORY" = "$GITHUB_REPOSITORY"
          fi

  # ---------------------------------------------------------------------------
  # Terraform format and validation
  # Initializes providers locally without connecting to either state backend.
  # ---------------------------------------------------------------------------
  terraform:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: 1.12.2
      - name: Check formatting
        run: terraform fmt -check -recursive
      - name: Validate application foundation
        working-directory: infra
        run: |
          terraform init -backend=false -input=false
          terraform validate

  # ---------------------------------------------------------------------------
  # Checkov static infrastructure scan
  # Scans the application Terraform root without remote state access.
  # ---------------------------------------------------------------------------
  checkov:
    name: Checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'
      - name: Install Checkov
        run: python -m pip install --disable-pip-version-check checkov==3.2.524
      - name: Scan application foundation
        run: checkov -d infra --framework terraform --quiet

  # ---------------------------------------------------------------------------
  # GitHub Actions syntax checks
  # Catches workflow errors before changes reach develop or main.
  # ---------------------------------------------------------------------------
  workflow:
    name: Workflow syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.5.0
        with:
          go-version: '1.24.2'
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Check workflows
        run: |
          "$(go env GOPATH)/bin/actionlint" -color
