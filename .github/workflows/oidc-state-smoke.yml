# -----------------------------------------------------------------------------
# GitHub OIDC and Terraform state smoke test
# Runs on the remote server runner after a push to any repository branch.
# Confirms the selected role and read-only access to the state bucket location.
# -----------------------------------------------------------------------------
name: OIDC state smoke

on:
  push:

permissions:
  contents: read
  id-token: write

jobs:
  # ---------------------------------------------------------------------------
  # OIDC role and state bucket connection
  # Main selects prod; all other repository branches select dev.
  # ---------------------------------------------------------------------------
  verify:
    name: Verify branch OIDC
    runs-on: [self-hosted, Linux, X64, aws-interviews-isolated-vm]
    environment: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
    steps:
      - name: Assume environment role through OIDC
        uses: aws-actions/configure-aws-credentials@v4.2.1
        with:
          aws-region: eu-west-3
          role-to-assume: ${{ github.ref == 'refs/heads/main' && vars.AWS_PROD_ROLE_ARN || vars.AWS_DEV_ROLE_ARN }}
          role-session-name: oidc-state-smoke
          unset-current-credentials: true
          mask-aws-account-id: true
      - name: Verify identity and state bucket location
        env:
          EXPECTED_ROLE: aws-interviews-${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}-deploy
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          role_arn="$(aws sts get-caller-identity --query Arn --output text)"
          case "$role_arn" in
            *":assumed-role/${EXPECTED_ROLE}/"*) ;;
            *) echo 'Unexpected AWS role' >&2; exit 1 ;;
          esac
          region="$(aws s3api get-bucket-location --bucket "$STATE_BUCKET" --query LocationConstraint --output text)"
          test "$region" = 'eu-west-3'
